<!DOCTYPE html>
<html>

<head>
    <title>Towns</title>
	<link rel="stylesheet" href="towns.css" />
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <script src="towns.js"></script>
</head>

<body>
<h1>Towns</h1>

<article>
    <header>Towns List</header>
    <select id="towns" size="4">
        <option>Sofia</option>
        <option>Plovdiv</option>
        <option>Varna</option>
        <option>Bourgas</option>
    </select>
</article>

<article>
    <header>Delete Town</header>
    <input type="text" id="townName" />
    <button id="btnDelete">Delete</button>
</article>

<article>
    <header>Add Town</header>
    <input type="text" id="newTownName" />
    <button id="btnAdd">Add</button>
</article>

<article>
    <header>Shuffle Towns</header>
    <button id="btnShuffle">Shuffle</button>
</article>

<div id="result"></div>
</body>

</html>
